<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理页 - 同学录</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container" id="app">
    <!-- 登录界面 -->
    <div id="loginView">
      <div class="login-box">
        <h1>🔐 管理员登录</h1>
        <p style="color:#888;margin-bottom:24px;">请输入密码查看同学录内容</p>
        <div class="form-group">
          <input type="password" id="passwordInput" placeholder="请输入管理密码" style="text-align:center;font-size:1.1em;">
        </div>
        <button class="btn-submit" onclick="login()" style="width:100%;">登录</button>
        <p id="loginError" style="color:#ff4444;margin-top:12px;display:none;"></p>
      </div>
    </div>

    <!-- 管理界面 -->
    <div id="adminView" style="display:none;">
      <header>
        <h1>📖 同学录管理</h1>
        <button class="btn-logout" onclick="logout()">退出登录</button>
      </header>
      <div class="stats" id="stats" style="display:none;">
        <span>共有 <strong id="totalCount">0</strong> 条同学留言</span>
      </div>
      <div class="card-grid" id="cardGrid"></div>
      <div class="empty-state" id="emptyState" style="display:none;">
        <span class="icon">📭</span>
        <p>还没有同学留言，快把这个页面发给同学们吧！</p>
      </div>
    </div>
  </div>

  <script>
    // ===== 配置 =====
    var SUPABASE_URL = 'https://hicvyyrcgmdllziatmmn.supabase.co';
    var SUPABASE_KEY = 'sb_publishable_XLDS1HhEzHZKmLSW0sLhWg_EZBpyLNf';
    var ADMIN_PASSWORD = '929566';
    var password = '';

    // ===== Supabase API 封装 =====
    function api(path, options) {
      options = options || {};
      options.headers = options.headers || {};
      options.headers['apikey'] = SUPABASE_KEY;
      options.headers['Authorization'] = 'Bearer ' + SUPABASE_KEY;
      if (!options.headers['Content-Type'] && options.body && !(options.body instanceof FormData)) {
        options.headers['Content-Type'] = 'application/json';
      }
      return fetch(SUPABASE_URL + path, options).then(function(r) {
        if (!r.ok) return r.text().then(function(t) { throw new Error(r.status + ': ' + t); });
        var ct = r.headers.get('content-type') || '';
        return ct.indexOf('application/json') !== -1 ? r.json() : r.text();
      });
    }

    // ===== 登录 =====
    document.getElementById('passwordInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') login();
    });

    async function login() {
      password = document.getElementById('passwordInput').value;
      if (!password) return;

      if (password !== ADMIN_PASSWORD) {
        showError('密码错误');
        return;
      }

      try {
        var data = await api('/rest/v1/classmates?select=*&order=created_at.desc');
        document.getElementById('loginView').style.display = 'none';
        document.getElementById('adminView').style.display = 'block';
        renderCards(data);
      } catch (e) {
        showError('加载失败：' + e.message);
      }
    }

    function showError(msg) {
      var err = document.getElementById('loginError');
      err.textContent = msg;
      err.style.display = 'block';
    }

    function logout() {
      password = '';
      document.getElementById('loginView').style.display = 'block';
      document.getElementById('adminView').style.display = 'none';
      document.getElementById('passwordInput').value = '';
    }

    // ===== 渲染卡片 =====
    function renderCards(data) {
      var grid = document.getElementById('cardGrid');
      var stats = document.getElementById('stats');
      var empty = document.getElementById('emptyState');

      if (!data || data.length === 0) {
        stats.style.display = 'none';
        grid.innerHTML = '';
        empty.style.display = 'block';
        return;
      }

      stats.style.display = 'block';
      empty.style.display = 'none';
      document.getElementById('totalCount').textContent = data.length;

      grid.innerHTML = data.map(function(item) {
        return '<div class="card">' +
          '<button class="btn-delete" title="删除" onclick="deleteItem(\'' + item.id + '\',\'' + esc(item.photo_url) + '\')">🗑</button>' +
          '<img src="' + esc(item.photo_url) + '" alt="' + esc(item.name) + '" loading="lazy">' +
          '<div class="card-body">' +
          '<h3>' + esc(item.name) + '</h3>' +
          '<p>' + esc(item.message) + '</p>' +
          '<time>' + new Date(item.created_at).toLocaleString('zh-CN') + '</time>' +
          '</div></div>';
      }).join('');
    }

    function esc(s) {
      var d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML.replace(/'/g, "\\'");
    }

    // ===== 删除 =====
    async function deleteItem(id, photoUrl) {
      if (!confirm('确定要删除这条留言吗？')) return;

      try {
        await api('/rest/v1/classmates?id=eq.' + id, { method: 'DELETE' });

        // 删除照片
        try {
          var parts = photoUrl.split('/');
          var fileName = parts[parts.length - 1];
          await api('/storage/v1/object/photos/' + fileName, { method: 'DELETE' });
        } catch (e) {}

        // 刷新列表
        var data = await api('/rest/v1/classmates?select=*&order=created_at.desc');
        renderCards(data);
      } catch (e) {
        alert('删除失败：' + e.message);
      }
    }
  </script>
</body>
</html>
