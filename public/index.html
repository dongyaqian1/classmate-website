<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>同学录 - 留下你的印记</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>📖 同学录</h1>
      <p class="subtitle">留下你的姓名、照片和想说的话吧 ✨</p>
    </header>

    <form id="submitForm" enctype="multipart/form-data">
      <div class="form-group">
        <label for="name">你的名字</label>
        <input type="text" id="name" name="name" placeholder="请输入你的姓名" maxlength="50" required>
      </div>

      <div class="form-group">
        <label for="message">想说的话</label>
        <textarea id="message" name="message" placeholder="写一段话给同学们吧..." rows="5" maxlength="1000" required></textarea>
        <span class="char-count"><span id="charCount">0</span>/1000</span>
      </div>

      <div class="form-group">
        <label for="photo">你的照片</label>
        <div class="upload-area" id="uploadArea">
          <input type="file" id="photo" name="photo" accept="image/*" hidden required>
          <div class="upload-placeholder" id="uploadPlaceholder">
            <span class="upload-icon">📷</span>
            <span>点击上传照片</span>
            <span class="upload-hint">支持 JPG、PNG、GIF、WebP，不超过 10MB</span>
          </div>
          <img id="preview" class="preview-img" style="display:none" alt="预览">
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">📝 提交留言</button>
    </form>

    <div class="toast" id="toast"></div>
  </div>

  <footer>
    <p>同学录 · 记录美好时光</p>
  </footer>

  <script>
    // ===== 照片上传预览 =====
    const photoInput = document.getElementById('photo');
    const uploadArea = document.getElementById('uploadArea');
    const uploadPlaceholder = document.getElementById('uploadPlaceholder');
    const preview = document.getElementById('preview');

    uploadArea.addEventListener('click', () => photoInput.click());

    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.classList.add('dragover');
    });

    uploadArea.addEventListener('dragleave', () => {
      uploadArea.classList.remove('dragover');
    });

    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      if (e.dataTransfer.files.length) {
        photoInput.files = e.dataTransfer.files;
        showPreview(e.dataTransfer.files[0]);
      }
    });

    photoInput.addEventListener('change', () => {
      if (photoInput.files.length) {
        showPreview(photoInput.files[0]);
      }
    });

    function showPreview(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        preview.src = e.target.result;
        preview.style.display = 'block';
        uploadPlaceholder.style.display = 'none';
      };
      reader.readAsDataURL(file);
    }

    // ===== 字数统计 =====
    const messageInput = document.getElementById('message');
    const charCount = document.getElementById('charCount');
    messageInput.addEventListener('input', () => {
      charCount.textContent = messageInput.value.length;
    });

    // ===== 表单提交 =====
    const form = document.getElementById('submitForm');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('name').value.trim();
      const message = document.getElementById('message').value.trim();
      const photo = photoInput.files[0];

      if (!name || !message || !photo) {
        showToast('请填写所有字段并上传照片', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = '提交中...';

      const formData = new FormData();
      formData.append('name', name);
      formData.append('message', message);
      formData.append('photo', photo);

      try {
        const res = await fetch('/api/submit', { method: 'POST', body: formData });
        const data = await res.json();

        if (data.success) {
          showToast('✅ 提交成功！谢谢你的留言~', 'success');
          form.reset();
          preview.style.display = 'none';
          uploadPlaceholder.style.display = '';
          charCount.textContent = '0';
        } else {
          showToast('❌ ' + data.error, 'error');
        }
      } catch (err) {
        showToast('❌ 网络错误，请稍后再试', 'error');
      }

      submitBtn.disabled = false;
      submitBtn.textContent = '📝 提交留言';
    });

    // ===== Toast 提示 =====
    function showToast(msg, type) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = 'toast ' + type + ' show';
      setTimeout(() => toast.classList.remove('show'), 3000);
    }
  </script>
</body>
</html>
