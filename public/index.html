<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>同学录 - 留下你的印记</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>📖 同学录</h1>
      <p class="subtitle">留下你的姓名、照片和想说的话吧 ✨</p>
    </header>

    <form id="submitForm" enctype="multipart/form-data">
      <div class="form-group">
        <label for="name">你的名字</label>
        <input type="text" id="name" name="name" placeholder="请输入你的姓名" maxlength="50" required>
      </div>
      <div class="form-group">
        <label for="message">想说的话</label>
        <textarea id="message" name="message" placeholder="写一段话给同学们吧..." rows="5" maxlength="1000" required></textarea>
        <span class="char-count"><span id="charCount">0</span>/1000</span>
      </div>
      <div class="form-group">
        <label for="photo">你的照片</label>
        <div class="upload-area" id="uploadArea">
          <input type="file" id="photo" name="photo" accept="image/*" hidden required>
          <div class="upload-placeholder" id="uploadPlaceholder">
            <span class="upload-icon">📷</span>
            <span>点击上传照片</span>
            <span class="upload-hint">支持 JPG、PNG、GIF、WebP，不超过 10MB</span>
          </div>
          <img id="preview" class="preview-img" style="display:none" alt="预览">
        </div>
      </div>
      <button type="submit" class="btn-submit" id="submitBtn">📝 提交留言</button>
    </form>
    <div class="toast" id="toast"></div>
  </div>

  <footer>
    <p>同学录 · 记录美好时光</p>
  </footer>

  <script>
    // ===== 配置 =====
    var SUPABASE_URL = 'https://hicvyyrcgmdllziatmmn.supabase.co';
    var SUPABASE_KEY = 'sb_publishable_XLDS1HhEzHZKmLSW0sLhWg_EZBpyLNf';

    // ===== 照片上传预览 =====
    var photoInput = document.getElementById('photo');
    var uploadArea = document.getElementById('uploadArea');
    var uploadPlaceholder = document.getElementById('uploadPlaceholder');
    var preview = document.getElementById('preview');

    uploadArea.addEventListener('click', function() { photoInput.click(); });

    uploadArea.addEventListener('dragover', function(e) { e.preventDefault(); uploadArea.classList.add('dragover'); });
    uploadArea.addEventListener('dragleave', function() { uploadArea.classList.remove('dragover'); });
    uploadArea.addEventListener('drop', function(e) {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      if (e.dataTransfer.files.length) { photoInput.files = e.dataTransfer.files; showPreview(e.dataTransfer.files[0]); }
    });

    photoInput.addEventListener('change', function() {
      if (photoInput.files.length) showPreview(photoInput.files[0]);
    });

    function showPreview(file) {
      var reader = new FileReader();
      reader.onload = function(e) { preview.src = e.target.result; preview.style.display = 'block'; uploadPlaceholder.style.display = 'none'; };
      reader.readAsDataURL(file);
    }

    // ===== 字数统计 =====
    var messageInput = document.getElementById('message');
    var charCount = document.getElementById('charCount');
    messageInput.addEventListener('input', function() { charCount.textContent = messageInput.value.length; });

    // ===== 表单提交 =====
    var form = document.getElementById('submitForm');
    var submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async function(e) {
      e.preventDefault();

      var name = document.getElementById('name').value.trim();
      var message = document.getElementById('message').value.trim();
      var photo = photoInput.files[0];

      if (!name || !message || !photo) { showToast('请填写所有字段并上传照片', 'error'); return; }
      if (photo.size > 10 * 1024 * 1024) { showToast('照片不能超过 10MB', 'error'); return; }

      submitBtn.disabled = true;
      submitBtn.textContent = '上传中...';

      try {
        // 1. 上传照片到 Supabase Storage
        var fileExt = photo.name.split('.').pop();
        var fileName = Date.now() + '-' + Math.random().toString(36).substring(2, 10) + '.' + fileExt;

        var uploadRes = await fetch(SUPABASE_URL + '/storage/v1/object/photos/' + fileName, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': 'Bearer ' + SUPABASE_KEY
          },
          body: photo
        });

        if (!uploadRes.ok) {
          var errText = await uploadRes.text();
          throw new Error(errText);
        }

        // 2. 获取照片公开 URL
        var photoUrl = SUPABASE_URL + '/storage/v1/object/public/photos/' + fileName;

        // 3. 保存记录到数据库
        var dbRes = await fetch(SUPABASE_URL + '/rest/v1/classmates', {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': 'Bearer ' + SUPABASE_KEY,
            'Content-Type': 'application/json',
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify({ name: name, message: message, photo_url: photoUrl })
        });

        if (!dbRes.ok) {
          var dbErr = await dbRes.text();
          throw new Error(dbErr);
        }

        showToast('✅ 提交成功！谢谢你的留言~', 'success');
        form.reset();
        preview.style.display = 'none';
        uploadPlaceholder.style.display = '';
        charCount.textContent = '0';
      } catch (err) {
        console.error(err);
        showToast('❌ 提交失败：' + (err.message || '网络错误'), 'error');
      }

      submitBtn.disabled = false;
      submitBtn.textContent = '📝 提交留言';
    });

    function showToast(msg, type) {
      var toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = 'toast ' + type + ' show';
      setTimeout(function() { toast.classList.remove('show'); }, 3000);
    }
  </script>
</body>
</html>
